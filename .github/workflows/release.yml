# 릴리스: 태그를 밀면 바이너리를 만들어 GitHub 릴리스에 올린다.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# 빌드는 scripts/release.sh를 그대로 쓴다. 워크플로가 go build 명령을 다시
# 적으면 ldflags(버전·커밋·시각 주입)가 두 곳에 생기고, 손으로 만든 빌드와
# CI가 만든 빌드가 조용히 달라진다.
#
# 손으로 실행(workflow_dispatch)하면 릴리스를 만들지 않고 산출물만 올린다.
# 태그를 붙이기 전에 다섯 플랫폼이 실제로 빌드되는지 확인하는 용도다.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "버전 표기 (비우면 git describe)"
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # 릴리스 생성과 자산 업로드에 필요하다

env:
  CGO_ENABLED: "0"

jobs:
  release:
    name: 빌드와 릴리스
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe와 변경 내역(직전 태그 이후 커밋)에 전체 이력이 필요하다.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 깨진 빌드를 릴리스로 굳히지 않는다. 태그를 되돌리는 것보다 여기서
      # 멈추는 편이 싸다.
      - name: 시험
        run: go test -count=1 ./...

      - name: 버전 결정
        id: ver
        # 입력값을 스크립트에 직접 끼워 넣지 않고 환경변수로 받는다.
        # ${{ }}는 실행 전에 문자열로 치환되므로, 그 자리에 셸 명령을 넣으면
        # 그대로 실행된다(입력이 신뢰할 수 있어도 이 습관은 지킨다).
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME}"
          elif [ -n "$VERSION_INPUT" ]; then
            version="$VERSION_INPUT"
          else
            version="$(git describe --tags --always)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # 태그에 하이픈이 있으면 사전 배포로 본다(v1.0.0-rc.1, v2.0.0-beta.3).
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "빌드할 버전: $version"

      - name: 빌드 (linux·darwin·windows / amd64·arm64)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # 태그가 가리키는 커밋의 시각을 빌드 시각으로 심는다. 같은 태그를
          # 다시 빌드해도 바이너리가 바이트 단위로 같아진다(release.sh가 이
          # 환경변수를 읽는다).
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          bash scripts/release.sh "$VERSION"

      - name: 릴리스 노트 작성
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          version="$VERSION"
          prev="$(git describe --tags --abbrev=0 "${version}^" 2>/dev/null || echo '')"

          {
            echo "## 설치"
            echo
            echo "쓰는 플랫폼의 파일 하나를 내려받아 실행 권한을 주면 끝입니다."
            echo "런타임 의존성이 없습니다(자산과 글꼴까지 바이너리에 들어 있습니다)."
            echo
            echo '```bash'
            echo "curl -LO https://github.com/${GITHUB_REPOSITORY}/releases/download/${version}/dbstudio_${version}_linux_amd64"
            echo "chmod +x dbstudio_${version}_linux_amd64"
            echo "./dbstudio_${version}_linux_amd64"
            echo '```'
            echo
            echo "처음 실행하면 슈퍼 어드민 계정과 임시 비밀번호가 터미널에 **한 번** 표시됩니다."
            echo
            echo "### 플랫폼"
            echo
            echo "| 플랫폼 | 파일 |"
            echo "|---|---|"
            echo "| Linux x86-64 | \`dbstudio_${version}_linux_amd64\` |"
            echo "| Linux ARM64 | \`dbstudio_${version}_linux_arm64\` |"
            echo "| macOS Intel | \`dbstudio_${version}_darwin_amd64\` |"
            echo "| macOS Apple Silicon | \`dbstudio_${version}_darwin_arm64\` |"
            echo "| Windows x86-64 | \`dbstudio_${version}_windows_amd64.exe\` |"
            echo "| Windows ARM64 | \`dbstudio_${version}_windows_arm64.exe\` |"
            echo
            echo "## 변경 내역"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s (%h)' "${prev}..${version}"
              echo
              echo "전체 비교: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${version}"
            else
              echo "첫 릴리스입니다."
            fi
            echo
            echo "## 검증"
            echo
            echo "내려받은 파일이 손상·교체되지 않았는지 확인합니다."
            echo
            echo '```bash'
            echo "sha256sum -c --ignore-missing SHA256SUMS"
            echo '```'
            echo
            echo '<details><summary>SHA256</summary>'
            echo
            echo '```'
            # sha256sum은 플랫폼에 따라 "<해시>  ./파일" 또는 "<해시> *./파일"로
            # 적는다. 노트에는 파일 이름만 보이게 다듬는다.
            sed -E 's/ \*?\.\// /' dist/SHA256SUMS
            echo '```'
            echo
            echo '</details>'
          } > release-notes.md

          echo "--- 노트 미리보기 ---"
          cat release-notes.md

      - name: 릴리스 생성
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file release-notes.md \
            "${flags[@]}" \
            dist/*

      # 태그 없이 손으로 돌린 경우. 릴리스를 만들지 않고 산출물만 남긴다.
      - name: 산출물 업로드 (릴리스 없이)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dbstudio-${{ steps.ver.outputs.version }}
          path: dist/
          retention-days: 14
