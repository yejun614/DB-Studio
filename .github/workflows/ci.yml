# 푸시·PR 검사.
#
# 세 가지를 본다: 형식(gofmt), 정적 분석과 시험(go vet · go test), 그리고
# 배포 대상 전체가 컴파일되는지(크로스 빌드).
#
# 크로스 빌드를 따로 두는 이유: 이 앱에는 OS별로 갈라지는 파일이 있다
# (internal/hostmon의 host_linux.go · host_windows.go · host_other.go,
# oslog_*.go). 리눅스에서 시험이 통과해도 macOS 빌드가 깨질 수 있고,
# 그 사실은 릴리스를 만드는 순간에야 드러난다.
name: CI

# main 푸시와 PR에서 돈다. 태그는 여기서 받지 않는다 — release 워크플로가 태그에서
# 같은 시험을 이미 돌리므로, 둘 다 걸면 태그를 밀 때마다 시험이 두 번 돈다.
#
# README의 CI 뱃지는 **main 브랜치의 마지막 실행**을 가리킨다. 태그에서만 돌면
# main 실행 기록이 없어 뱃지가 영원히 "no status"로 남는다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 연달아 푸시하면 앞의 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 액션 버전은 최신 메이저로 맞춘다.
#
# 이유: v4·v5는 Node 20에서 돌고, 러너가 Node 20 지원을 끝내는 중이라 실행마다
# "Node.js 20 is deprecated ... being forced to run on Node.js 24" 경고가 붙는다.
# 강제 실행이 끝나면 경고가 아니라 실패가 된다. v7은 node24 런타임이다.

env:
  CGO_ENABLED: "0"

jobs:
  test:
    name: 시험 (${{ matrix.os }})
    # 윈도우까지 도는 이유: 호스트 감시와 OS 로그 읽기가 플랫폼마다 다른
    # 구현을 쓴다. 한쪽에서만 돌리면 다른 쪽 코드는 아무도 실행하지 않는다.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 형식 확인 (gofmt)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt로 정렬되지 않은 파일이 있습니다:"
            echo "$unformatted"
            echo
            echo "고치는 방법: gofmt -w <파일>"
            exit 1
          fi
          echo "정렬 확인됨"

      - name: 정적 분석 (go vet)
        run: go vet ./...

      # 통합 시험(실제 DB 접속)은 -integration 플래그나 DBSTUDIO_INTEGRATION이
      # 있을 때만 돈다. 여기서는 주지 않으므로 자동으로 건너뛴다.
      - name: 시험
        run: go test -count=1 ./...

  cross-build:
    name: 크로스 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 산출물은 버리고 컴파일 여부만 본다. 실제 릴리스 산출물은
      # release 워크플로가 scripts/release.sh로 만든다(빌드 플래그의 유일한 출처).
      #
      # 목록은 scripts/release.sh 의 TARGETS 와 같아야 한다. 여기서 빠진 대상은
      # 릴리스를 만드는 순간에 처음 빌드되고, 그때 깨지면 태그를 되돌려야 한다.
      - name: 배포 대상 전체 컴파일
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 \
                        windows/amd64 windows/arm64; do
            echo "→ $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath -o /dev/null ./cmd/dbstudio
          done
