# ARMv8.0 라즈베리파이용 덮어쓰기 파일.
#
#   docker compose -f docker/compose.test.yaml \
#                  -f docker/compose.test.armv8.yaml up -d --build clickhouse
#
# 공식 ARM 빌드는 ARMv8.2-A 를 요구해서 파이 4·3 에서는 SIGILL 로 죽는다.
# 이미지를 그 자리에서 만들어 호환 빌드로 바꾸고, 메모리 설정도 함께 넣는다
# (자세한 이유는 clickhouse-armv8.Dockerfile 주석에).
#
# 파이 5(Cortex-A76)는 ARMv8.2-A 라 이 파일이 필요 없다.
services:
  clickhouse:
    build:
      context: .
      dockerfile: clickhouse-armv8.Dockerfile
    image: dbstudio-test/clickhouse-armv8:24.8
