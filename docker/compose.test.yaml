# 개발/테스트용 대상 데이터베이스 인스턴스.
# 실행: docker compose -f docker/compose.test.yaml up -d
# 정리: docker compose -f docker/compose.test.yaml down -v
#
# 포트는 로컬에 이미 떠 있는 DB와 충돌하지 않도록 1을 접두사로 붙였다.
name: dbstudio-test

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpw123
      MYSQL_DATABASE: appdb
    ports: ["13306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootpw123"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: rootpw123
      POSTGRES_DB: appdb
    ports: ["15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "RootPw123!"
      MSSQL_PID: Developer
    ports: ["11433:1433"]

  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpw123
      MONGO_INITDB_DATABASE: appdb
    ports: ["27018:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "rootpw123"]
    ports: ["16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "rootpw123", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Oracle Free는 이미지 크기가 크고 초기화가 오래 걸리므로 별도 프로파일로 분리했다.
  # 실행: docker compose -f docker/compose.test.yaml --profile oracle up -d
  oracle:
    image: gvenzl/oracle-free:23-slim
    profiles: ["oracle"]
    environment:
      ORACLE_PASSWORD: RootPw123
      APP_USER: appuser
      APP_USER_PASSWORD: RootPw123
    ports: ["11521:1521"]

  # RabbitMQ. 관리 플러그인(rabbitmq_management)이 켜진 이미지를 쓴다.
  # 이 앱의 브로커 화면은 관리 HTTP API(기본 15672)로 붙으므로, 커넥션 등록 시
  # 포트를 15673으로 지정해야 한다. AMQP(5672)는 1 접두사 관례에 따라 15672로 뺐다.
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: rootpw123
    ports:
      - "15672:5672"   # AMQP
      - "15673:15672"  # 관리 API
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Kafka. KRaft 모드 단일 노드(주키퍼 없음). apache/kafka 공식 이미지를 쓴다.
  # 이 앱의 브로커 화면은 카프카 프로토콜로 붙으므로, 커넥션 등록 시
  # 포트를 19092로 지정해야 한다.
  kafka:
    # 태그를 세 자리로 고정한다. apache/kafka에는 3.9 같은 두 자리 태그가 없어
    # `up`이 "not found"로 멈춘다(다른 서비스의 pull까지 함께 중단된다).
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # 호스트에서 접속할 주소다. 컨테이너 안에서는 9092지만, 호스트에서는
      # 19092로 매핑되므로 광고 주소도 그에 맞춘다.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 단일 노드이므로 복제·트랜잭션 관련 기본값을 1로 낮춘다.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports: ["19092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
